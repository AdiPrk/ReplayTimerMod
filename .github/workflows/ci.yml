name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  silksong-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Silksong plugin
        run: dotnet build src/Silksong/ReplayTimerMod.SS.csproj -c Debug --nologo /p:SkipModPackaging=true
