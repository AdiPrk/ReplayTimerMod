name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Shared-logic unit tests (no game install needed — Unity/BepInEx are
  # stubbed; see tests/ReplayTimerMod.Tests).
  dotnet-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run unit tests
        run: dotnet test tests/ReplayTimerMod.Tests/ReplayTimerMod.Tests.csproj -c Release --nologo

  # Server-side validators + the RTM3 wire-format contract test against
  # fixtures generated by the C# encoder.
  deno-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run edge-function tests
        run: deno test --allow-read supabase/functions/tests/

  # Compile check for the Silksong plugin (all refs come from NuGet).
  # The two Hollow Knight targets need real game DLLs (ValidateHKReferences
  # fails fast without them), so they can only be built locally.
  silksong-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Silksong plugin
        # Compile only — skip the local-install/Thunderstore post-build target.
        run: dotnet build src/Silksong/ReplayTimerMod.SS.csproj -c Debug --nologo /p:SkipModPackaging=true
